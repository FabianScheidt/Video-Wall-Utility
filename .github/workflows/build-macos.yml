name: macOS Build & Release

on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build app
        run: |
          xcodebuild \
            -project "Video Wall Utility.xcodeproj" \
            -scheme "Video Wall Utility" \
            -configuration Release \
            -derivedDataPath build

      - name: Zip app
        run: |
          cd build/Build/Products/Release
          zip -r "Video Wall Utility.zip" "Video Wall Utility.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Video-Wall-Utility-macOS
          path: build/Build/Products/Release/Video Wall Utility.zip

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/Video Wall Utility.zip
          generate_release_notes: true
